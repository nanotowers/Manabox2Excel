<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi último destape</title>
<meta name="description" content="Las cartas que saqué en el último prerelease.">
<meta property="og:title" content="Mi último destape">
<meta property="og:image" content="https://nanotowers.github.io/Manabox2Excel/assets/banner-destape.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/styles.css?v=202608281545">
</head>
<body>

<header>
  <img class="hero" src="assets/banner-destape.jpg" alt="Mi último destape">
  <p id="subtitulo">Las cartas que salieron de los sobres</p>
  <div class="stats" id="stats"></div>
  <div style="margin-top:1rem;display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap">
    <a class="btn" href="index.html">← Colección</a>
    <a class="btn" href="sld.html">Galería SLD</a>
    <a class="btn" href="mazos.html">Mis mazos</a>
    <a class="btn" href="constructor.html">Arma tu mazo</a>
  </div>
</header>

<main>
  <div id="loader">
    <p id="loader-txt">Cargando destape...</p>
    <div class="bar"><div class="fill" id="loader-fill"></div></div>
  </div>

  <div id="app" hidden>
    <div class="panel">
      <div class="frow">
        <div class="fgroup" style="flex:1;min-width:200px">
          <label>Buscar</label>
          <input class="mtxt wide" id="f-text" placeholder="Nombre de carta...">
        </div>
        <div class="fgroup">
          <label>Edición</label>
          <select class="msel" id="f-set"><option value="">Todas</option></select>
        </div>
        <div class="fgroup">
          <label>Rareza</label>
          <div style="display:flex;gap:.4rem;flex-wrap:wrap">
            <button class="chip on" data-r="">Todas</button>
            <button class="chip" data-r="mythic">Míticas</button>
            <button class="chip" data-r="rare">Raras</button>
            <button class="chip" data-r="foil">Foils</button>
          </div>
        </div>
        <div class="fgroup">
          <label>Orden</label>
          <select class="msel" id="f-sort">
            <option value="rareza">Por rareza</option>
            <option value="name">Nombre</option>
            <option value="cmc">CMC</option>
            <option value="precio">Precio</option>
          </select>
        </div>
      </div>
    </div>

    <div class="bar2"><div class="count" id="count"></div></div>
    <div id="cartas"></div>
  </div>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
